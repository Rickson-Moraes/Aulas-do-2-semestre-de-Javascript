<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Média</title>
  </head>

  <body>
    <input type="number" id="nota1" placeholder="Nota 1" />

    <input type="number" id="nota2" placeholder="Nota 2" />

    <button>Calcular Média</button>

    <div id="resultadoCalculo"></div>

    <script>
      function calcularMedia(n1, n2) {
        const media = (n1 + n2) / 2;
        return media;
      }

      function calcular() {
        const nota1 = Number(document.getElementById("nota1").value);
        const nota2 = Number(document.getElementById("nota2").value);

        const media = calcularMedia(nota1, nota2);

        const resultado = document.getElementById("resultadoCalculo");

        resultado.textContent = "Média: " + media.toFixed(1);

        if (media >= 7.0) {
          resultado.textContent += " - Aprovado";
          resultado.style.color = "green";
        } else {
          resultado.textContent += " - Recuperação";
          resultado.style.color = "red";
        }
      }

      document.querySelector("button").addEventListener("click", calcular);
    </script>
  </body>
</html>
